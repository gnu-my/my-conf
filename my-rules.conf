#my自用
[mitm]
hostname = www.guazimanhua.com

[rewrite_local]
# 匹配瓜子漫画阅读页，在 <head> 后注入隐藏广告的 CSS 样式
^https?:\/\/www\.guazimanhua\.com\/chapter\.php url response-body (<head\b[^>]*>) response-body $1<style>div.desktop-reader-top-ad,div.mobile-reader-top-static-ad,div[aria-label="推广"],div[aria-label="广告"]{display:none!important;}</style>
# 直接拦截瓜子漫画的广告 GIF 图片和广告 JS 脚本
^https?:\/\/www\.guazimanhua\.com\/assets\/ad\/ url reject
^https?:\/\/www\.guazimanhua\.com\/assets\/reader\/mobile-top-static-ad\.js url reject
^https?:\/\/.*\.xhsqd12\.com url reject
