#my自用
[mitm]
hostname = www.guazimanhua.com

[rewrite_local]

# 瓜子漫画净化
# 1. 直接阻断站内广告脚本与第三方广告域名
^https?:\/\/www\.guazimanhua\.com\/assets\/reader\/mobile-(top-static|bottom)-ad\.js url reject-200
^https?:\/\/(ec766|youandmerunfast|safa88)\.com\/ url reject-200
# 2. 注入 CSS 抹平顶部/移动端广告占位框（包含所有子路径页面）
^https?:\/\/www\.guazimanhua\.com\/.* url response-body (<head>) response-body $1<style>.desktop-reader-top-ad,.mobile-reader-top-static-ad{display:none!important;height:0!important;margin:0!important;padding:0!important;}</style>
