#my自用
[mitm]

hostname = www.guazimanhua.com

[rewrite_local]

# 瓜子漫画净化
# 瓜子漫画 - 站内广告脚本与广告图片路径阻断 (重写)
^https?:\/\/www\.guazimanhua\.com\/assets\/reader\/mobile-.*-ad\.js url reject-200
^https?:\/\/www\.guazimanhua\.com\/assets\/ad\/ url reject-200
# 瓜子漫画 - 隐藏广告占位框 (重写)
^https?:\/\/www\.guazimanhua\.com\/.* url response-body (<head.*?>) response-body $1<style>.desktop-reader-top-ad,.mobile-reader-top-static-ad,[aria-label="推广"]{display:none!important;height:0!important;margin:0!important;padding:0!important;}</style>
# 瓜子漫画去除侧边栏
^https?:\/\/www\.guazimanhua\.com\/.* url url script-response-body https://raw.githubusercontent.com/gnu-my/my-js/refs/heads/main/guazimanhua.js


