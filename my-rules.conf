#my自用
[mitm]
hostname = www.guazimanhua.com

[rewrite_local]
#瓜子漫画
# 1. 拦截广告 JS 脚本与广告图片请求（路径级直接拒绝）
^https?:\/\/www\.guazimanhua\.com\/assets\/(reader\/mobile-top-static-ad\.js|ad\/.*) url reject
# 2. 精准替换标签，注入 display:none 隐藏广告占位框
#^https?:\/\/www\.guazimanhua\.com\/chapter\.php url response-body class="desktop-reader-top-ad" response-body class="desktop-reader-top-ad" style="display:none!important;"
#^https?:\/\/www\.guazimanhua\.com\/chapter\.php url response-body class="mobile-reader-top-static-ad" response-body class="mobile-reader-top-static-ad" style="display:none!important;"
#^https?:\/\/www\.guazimanhua\.com\/chapter\.php url response-body class="reader-app-card" response-body class="reader-app-card" style="display:none!important;"
#^https?:\/\/www\.guazimanhua\.com\/chapter\.php url response-body class="reader-app-download-prompt" response-body class="reader-app-download-prompt" style="display:none!important;"
#^https?:\/\/www\.guazimanhua\.com\/chapter\.php url response-body (<div class="(mobile-reader-top-static-ad|desktop-reader-top-ad)"[\s\S]*?<\/div>|<section class="(reader-app-card|reader-app-download-prompt)"[\s\S]*?<\/section>) response-body ""

# 1. 注入 CSS 移除所有高 z-index 透明拦截层与隐藏 iframe
^https?:\/\/www\.guazimanhua\.com url response-body (<head[^>]*>) response-body $1<style>div[style*="display: none"] iframe, div[class*="CrJkG"], div[id*="CrJkG"] { display: none !important; pointer-events: none !important; }</style>

# 2. 匹配并直接拦截第三方动态广告域名的 JS / 请求
^https?:\/\/(ec766|youandmerunfast|safa88)\.com\/ url reject-200
