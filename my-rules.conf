[mitm]
hostname = www.guazimanhua.com

[rewrite_local]
#瓜子漫画
# 1. 注入 CSS 移除所有高 z-index 透明拦截层与隐藏 iframe
^https?:\/\/www\.guazimanhua\.com url response-body (<head[^>]*>) response-body $1<style>div[style*="display: none"] iframe, div[class*="CrJkG"], div[id*="CrJkG"] { display: none !important; pointer-events: none !important; }</style>

# 2. 匹配并直接拦截第三方动态广告域名的 JS / 请求
^https?:\/\/(ec766|youandmerunfast|safa88)\.com\/ url reject-200
